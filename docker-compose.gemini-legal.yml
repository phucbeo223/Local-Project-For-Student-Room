# Opt-in overlay. Rebuild/recreate API explicitly to activate in the running app.
# Uses existing GEMINI_BASE_URL / GEMINI_DOCKER_BASE_URL and credentials.
services:
  api:
    environment:
      CHATBOT_AGENTS_ENABLED: "true"
      CHATBOT_ANSWER_SYNTHESIS_ENABLED: "true"
      CHATBOT_LEGAL_SELECTION_PROVIDER: gemini
      CHATBOT_LEGAL_GENERATION_MODE: ${CHATBOT_LEGAL_GENERATION_MODE:-combined}
  ragas-eval:
    environment:
      CHATBOT_AGENTS_ENABLED: "true"
      CHATBOT_ANSWER_SYNTHESIS_ENABLED: "true"
      CHATBOT_LEGAL_SELECTION_PROVIDER: gemini
      CHATBOT_LEGAL_GENERATION_MODE: ${CHATBOT_LEGAL_GENERATION_MODE:-combined}
