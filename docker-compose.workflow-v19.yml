# Local measured Gemini workflow. Previous Word releases remain available.
services:
  api:
    image: nckh-api:workflow-v19
    environment:
      CHATBOT_LEGAL_SCHEMA: legal_word_workflow_v19_20261007
      CHATBOT_GRAPH_SCHEMA: graph_rag_word_workflow_v19
      CHATBOT_LISTING_SCHEMA: housing_graph_word_workflow_v19
      CHATBOT_GRAPH_ENABLED: "true"
      CHATBOT_LLM_PROVIDER: gemini
      CHATBOT_LEGAL_SELECTION_PROVIDER: gemini
      CHATBOT_AGENTS_ENABLED: "true"
      CHATBOT_ANSWER_SYNTHESIS_ENABLED: "true"
      CHATBOT_LEGAL_GENERATION_MODE: separate
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: "5"
  web:
    image: nckh-web:workflow-v19
  ragas-eval:
    environment:
      CHATBOT_LEGAL_SCHEMA: legal_word_workflow_v19_20261007
      CHATBOT_GRAPH_ENABLED: "true"
      CHATBOT_GRAPH_SCHEMA: graph_rag_word_workflow_v19
      CHATBOT_LISTING_SCHEMA: housing_graph_word_workflow_v19
      CHATBOT_LLM_PROVIDER: gemini
      CHATBOT_LEGAL_SELECTION_PROVIDER: gemini
      CHATBOT_AGENTS_ENABLED: "true"
      CHATBOT_ANSWER_SYNTHESIS_ENABLED: "true"
      CHATBOT_LEGAL_GENERATION_MODE: separate
      RAGAS_JUDGE_PROVIDER: gemini
      RAGAS_JUDGE_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - ./docs:/workspace/docs
      - ./Data:/workspace/Data:ro
